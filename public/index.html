<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-matching cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <div class="container mx-auto px-4 py-8 md:py-12">
        <header class="text-center mb-12 animate-fade-in-up">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-2">E-<span class="text-sky-600">Matching Cards</span></h1>
            <p class="text-sm text-slate-500 mx-auto">&copy; 2025 | Ning</p>
        </header>

        <div id="topics-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            <!-- Skeleton Loader akan disisipkan di sini oleh JavaScript -->
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const topicsGrid = document.getElementById('topics-grid');

    const showSkeletonLoader = () => {
        let skeletons = '';
        for (let i = 0; i < 3; i++) {
            skeletons += `
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden animate-pulse">
                    <div class="aspect-video bg-slate-200"></div>
                    <div class="p-6">
                        <div class="h-6 bg-slate-200 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-slate-200 rounded w-full mb-2"></div>
                        <div class="h-4 bg-slate-200 rounded w-5/6 mb-6"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="h-10 bg-slate-200 rounded-lg"></div>
                            <div class="h-10 bg-slate-200 rounded-lg"></div>
                        </div>
                    </div>
                </div>`;
        }
        topicsGrid.innerHTML = skeletons;
    };

    showSkeletonLoader();

    try {
        const response = await fetch('/api/topics');
        if (!response.ok) throw new Error('Gagal mengambil data topik.');
        
        const topics = await response.json();
        
        topicsGrid.innerHTML = ''; // Hapus skeleton loader

        if (topics.length === 0) {
            topicsGrid.innerHTML = `<p class="col-span-full text-center text-slate-500">Belum ada topik yang tersedia.</p>`;
            return;
        }

        topics.forEach((topic, index) => {
            const cardHTML = `
                <div class="group bg-white rounded-2xl shadow-sm hover:shadow-lg border border-slate-200 transition-all duration-300 transform hover:-translate-y-1 overflow-hidden animate-fade-in-up" style="animation-delay: ${index * 0.1}s">
                    <div class="relative overflow-hidden aspect-video">
                        <img src="${topic.thumbnail_url || 'https://via.placeholder.com/400x225.png?text=No+Image'}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" alt="${topic.title}">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h2 class="text-xl font-bold text-slate-900 mb-2 capitalize">${topic.title}</h2>
                        <p class="text-slate-600 text-sm mb-6 flex-grow">${topic.description || 'Tidak ada deskripsi.'}</p>
                        <div class="mt-auto grid grid-cols-2 gap-3">
                            <a href="/game/${topic.category_slug}" class="text-center bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200">Mulai Game</a>
                            <a href="/quiz/${topic.category_slug}" class="text-center bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200">Mulai Kuis</a>
                        </div>
                    </div>
                </div>
            `;
            topicsGrid.innerHTML += cardHTML;
        });

    } catch (error) {
        topicsGrid.innerHTML = `<p class="col-span-full text-center text-red-500 font-semibold">${error.message}</p>`;
        console.error('Error fetching topics:', error);
    }
});
</script>
</body>
</html>
