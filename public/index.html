<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-matching cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 md:py-12">
        <header class="text-center mb-12 animate-fade-in-up">
            <h1 class="text-4xl md:text-5xl font-bold text-indigo-800 mb-2">E<span class="text-pink-500">Matching Cards</span></h1>
            <p class="text-sm text-gray-700 mx-auto">&copy; 2025 | Ning</p>
        </header>

        <div id="topics-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            <p id="loading-text" class="col-span-full text-center text-slate-500">Memuat topik...</p>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const topicsGrid = document.getElementById('topics-grid');
    const loadingText = document.getElementById('loading-text');

    try {
        const response = await fetch('/api/topics');
        if (!response.ok) throw new Error('Gagal mengambil data topik.');
        
        const topics = await response.json();
        
        loadingText.style.display = 'none';

        if (topics.length === 0) {
            topicsGrid.innerHTML = `<p class="col-span-full text-center text-slate-500">Belum ada topik yang tersedia.</p>`;
            return;
        }

        topics.forEach((topic, index) => {
            const cardHTML = `
                <div class="group bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 overflow-hidden animate-fade-in-up" style="animation-delay: ${index * 0.1}s">
                    <div class="relative overflow-hidden aspect-video">
                        <img src="${topic.thumbnail_url || 'https://via.placeholder.com/400x225.png?text=No+Image'}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" alt="${topic.title}">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h2 class="text-xl font-bold text-slate-800 mb-2 capitalize">${topic.title}</h2>
                        <p class="text-slate-600 text-sm mb-6 flex-grow">${topic.description}</p>
                        <div class="mt-auto grid grid-cols-2 gap-3">
                            <a href="/game/${topic.category_slug}" class="text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-all">Mulai Game</a>
                            <a href="/quiz/${topic.category_slug}" class="text-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition-all">Mulai Kuis</a>
                        </div>
                    </div>
                </div>
            `;
            topicsGrid.innerHTML += cardHTML;
        });

    } catch (error) {
        loadingText.textContent = error.message;
        console.error('Error fetching topics:', error);
    }
});
</script>
</body>
</html>
