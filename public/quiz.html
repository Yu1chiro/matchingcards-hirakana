<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-slate-50 min-h-screen text-slate-800">

    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between max-w-2xl mx-auto">
                <button onclick="window.history.back()" class="flex items-center gap-2 px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-all">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                
                <div class="flex flex-col items-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Kuis</p>
                    <p class="text-sm font-bold text-slate-800">Soal <span id="question-number">1</span> / <span id="total-questions">-</span></p>
                </div>

                <div class="w-10"></div> </div>
        </div>
        <div class="w-full bg-slate-100 h-1.5">
            <div id="progress-bar" class="bg-blue-500 h-1.5 transition-all duration-500" style="width: 0%"></div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6 max-w-2xl pb-20">
        <div id="quiz-container">
            <div id="loading-state" class="text-center py-10">
                <i class="fas fa-circle-notch fa-spin text-blue-500 text-3xl mb-3"></i>
                <p class="text-slate-500">Memuat soal...</p>
            </div>

            <div id="question-box" class="hidden">
                <div id="image-container" class="mb-5 hidden rounded-2xl overflow-hidden border border-slate-200 shadow-sm bg-white">
                    <img id="question-image" src="" class="w-full max-h-60 object-contain">
                </div>

                <div class="mb-6">
                    <h2 id="question-text" class="text-xl font-bold text-slate-800 leading-relaxed"></h2>
                </div>

                <div id="options-container" class="space-y-3">
                    </div>
            </div>
        </div>
    </div>

<script>
    let quizData = [];
    let userAnswersLog = []; // Menyimpan jawaban user
    let currentQuestionIndex = 0;
    
    // Ambil Level ID dari URL
    const levelId = window.location.pathname.split('/').pop();

    const els = {
        qNum: document.getElementById('question-number'),
        qTotal: document.getElementById('total-questions'),
        progress: document.getElementById('progress-bar'),
        qBox: document.getElementById('question-box'),
        loading: document.getElementById('loading-state'),
        imgContainer: document.getElementById('image-container'),
        qImg: document.getElementById('question-image'),
        qText: document.getElementById('question-text'),
        opts: document.getElementById('options-container')
    };

    async function fetchAndStartQuiz() {
        try {
            const res = await fetch(`/api/quiz/level/${levelId}`);
            if (!res.ok) throw new Error('Gagal mengambil data kuis');
            const apiData = await res.json();
            
            if (apiData.length === 0) throw new Error('Belum ada soal kuis untuk level ini.');

            quizData = apiData.map(q => ({
                id: q.id,
                question: q.question,
                imageUrl: q.image_url,
                options: { a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d },
                correctAnswer: q.correct_answer
            }));
            
            startQuiz();
        } catch (error) {
            els.loading.innerHTML = `<p class="text-red-500">${error.message}</p>`;
        }
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        userAnswersLog = []; // Reset log
        els.loading.classList.add('hidden');
        els.qBox.classList.remove('hidden');
        els.qTotal.textContent = quizData.length;
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizData[currentQuestionIndex];
        
        // Update UI Header
        els.qNum.textContent = currentQuestionIndex + 1;
        els.progress.style.width = `${(currentQuestionIndex / quizData.length) * 100}%`;

        // Update Image
        if (q.imageUrl) {
            els.imgContainer.classList.remove('hidden');
            els.qImg.src = q.imageUrl;
        } else {
            els.imgContainer.classList.add('hidden');
        }

        // Update Text
        els.qText.textContent = q.question;

        // Render Options
        els.opts.innerHTML = '';
        const labels = { a: 'A', b: 'B', c: 'C', d: 'D' };
        
        for (const [key, value] of Object.entries(q.options)) {
            const btn = document.createElement('button');
            btn.className = `w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-blue-400 hover:bg-blue-50 transition-all active:scale-98 flex items-center gap-4 group`;
            btn.onclick = () => handleAnswer(key, btn);
            btn.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 font-bold flex items-center justify-center group-hover:bg-blue-200 group-hover:text-blue-700 transition-colors">
                    ${labels[key]}
                </div>
                <span class="font-semibold text-slate-700 group-hover:text-blue-900">${value}</span>
            `;
            els.opts.appendChild(btn);
        }
    }

    function handleAnswer(selectedKey, btnElement) {
        // Disable semua tombol agar tidak diklik 2x
        const allBtns = els.opts.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        const q = quizData[currentQuestionIndex];
        const isCorrect = selectedKey === q.correctAnswer;

        // Simpan data jawaban ke log
        userAnswersLog.push({
            question: q.question,
            imageUrl: q.imageUrl,
            selectedKey: selectedKey,
            selectedAnswerText: q.options[selectedKey],
            correctKey: q.correctAnswer,
            correctAnswerText: q.options[q.correctAnswer],
            isCorrect: isCorrect
        });

        // Visual Feedback Instant (Opsional, biar interaktif)
        if (isCorrect) {
            btnElement.classList.replace('border-slate-200', 'border-green-500');
            btnElement.classList.replace('hover:bg-blue-50', 'bg-green-50');
        } else {
            btnElement.classList.replace('border-slate-200', 'border-red-500');
            btnElement.classList.replace('hover:bg-blue-50', 'bg-red-50');
        }

        // Delay sedikit sebelum lanjut
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }, 800);
    }

    function finishQuiz() {
        // Hitung Skor
        const correctCount = userAnswersLog.filter(a => a.isCorrect).length;
        const finalScore = Math.round((correctCount / quizData.length) * 100);

        // Siapkan Objek Result
        const resultData = {
            score: finalScore,
            correctCount: correctCount,
            totalQuestions: quizData.length,
            details: userAnswersLog,
            date: new Date().toISOString(),
            levelId: levelId
        };

        // Simpan ke LocalStorage
        localStorage.setItem('quizResult', JSON.stringify(resultData));

        // Redirect ke Halaman Result
        window.location.href = '/results';
    }

    document.addEventListener('DOMContentLoaded', fetchAndStartQuiz);
</script>
</body>
</html>
