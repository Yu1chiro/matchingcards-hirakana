<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<!-- changes -->
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans text-slate-800 p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Welcome back Ning!</h1>
            <p class="text-slate-500 mt-2">Yuk kelola materimu!</p>
        </div>
        <form action="/login" method="POST">
            <div class="mb-4">
                <input type="text" id="username" name="username" placeholder="Username" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200" required>
            </div>
            <div class="mb-6">
                <input type="password" id="password" name="password" placeholder="Password" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200" required>
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                Sign In
            </button>
        </form>
    </div>
   
</body>
</html>
