<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center">
                        <i class="fas fa-cog text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Admin Dashboard</h1>
                        <p class="text-xs text-slate-500 hidden sm:block">Kelola Konten Pembelajaran</p>
                    </div>
                </div>
                <a href="/logout" class="flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition-all duration-200 text-sm sm:text-base">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-5">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-layer-group text-white text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold text-white">Kelola Topik Pembelajaran</h2>
                        <p class="text-blue-100 text-xs sm:text-sm mt-1">Tambah, edit, dan hapus topik pembelajaran</p>
                    </div>
                </div>
            </div>

            <div class="p-6 sm:p-8 bg-white">
                <form id="topic-form" class="space-y-5">
                    <input type="hidden" id="topic-id">
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <div class="space-y-2">
                            <label for="topic-title" class="flex items-center space-x-2 text-sm font-semibold text-gray-700">
                                <i class="fas fa-heading text-slate-500"></i>
                                <span>Judul Topik</span>
                            </label>
                            <input type="text" id="topic-title" required placeholder="Contoh: Salam Sapa"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200 text-sm sm:text-base">
                        </div>

                        <div class="space-y-2">
                            <label for="topic-slug" class="flex items-center space-x-2 text-sm font-semibold text-gray-700">
                                <i class="fas fa-link text-slate-500"></i>
                                <span>URL Kategori</span>
                            </label>
                            <input type="text" id="topic-slug" required placeholder="Contoh: aisatsu"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200 font-mono text-sm">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="topic-thumbnail" class="flex items-center space-x-2 text-sm font-semibold text-gray-700">
                            <i class="fas fa-image text-slate-500"></i>
                            <span>Upload Thumbnail</span>
                        </label>
                        <input type="file" id="topic-thumbnail" accept="image/*"
                               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200 text-sm">
                        <p id="topic-current-thumb" class="text-xs text-slate-500 truncate"></p>
                    </div>

                    <div class="space-y-2">
                        <label for="topic-description" class="flex items-center space-x-2 text-sm font-semibold text-gray-700">
                            <i class="fas fa-align-left text-slate-500"></i>
                            <span>Deskripsi Singkat</span>
                        </label>
                        <textarea id="topic-description" rows="3" placeholder="Jelaskan tentang topik ini..."
                                  class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all duration-200 resize-none text-sm sm:text-base"></textarea>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4">
                        <button type="button" id="topic-cancel-btn" class="hidden order-2 sm:order-1 px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 text-sm sm:text-base">
                            <i class="fas fa-times"></i><span>Batal</span>
                        </button>
                        <button type="submit" id="topic-submit-btn" class="order-1 sm:order-2 px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-lg transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center space-x-2 text-sm sm:text-base">
                            <i class="fas fa-plus-circle"></i><span>Tambah Topik</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="px-6 pb-8">
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                    <div id="topics-table-container" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="content-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col">
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-5 rounded-t-2xl">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-cog text-white text-lg"></i>
                        </div>
                        <h2 id="modal-title" class="text-lg sm:text-xl font-bold text-white">Kelola Konten</h2>
                    </div>
                    <button id="close-modal-btn" class="w-10 h-10 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg transition-all duration-200 flex items-center justify-center">
                        <i class="fas fa-times text-white text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                <div class="bg-white rounded-xl p-6 mb-6 border border-slate-200 shadow-sm">
                    <div class="flex items-center space-x-3 mb-5">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-gamepad text-white"></i>
                        </div>
                        <h3 class="text-lg sm:text-xl font-bold text-blue-700">Kartu Game (Kotoba)</h3>
                    </div>
                    
                    <form id="kotoba-form" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="flex items-center space-x-2 text-xs font-semibold text-gray-600">
                                    <i class="fas fa-image text-slate-500 text-sm"></i><span>Upload Gambar</span>
                                </label>
                                <input type="file" id="kotoba-image" required accept="image/*"
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-sky-500 text-sm">
                            </div>
                            <div class="space-y-2">
                                <label class="flex items-center space-x-2 text-xs font-semibold text-gray-600">
                                    <i class="fas fa-font text-slate-500 text-sm"></i><span>Upload Gambar Kata</span>
                                </label>
                                <input type="file" id="kotoba-word" required accept="image/*"
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-sky-500 text-sm">
                            </div>
                        </div>
                        <button type="submit" class="w-full sm:w-auto px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg shadow-sm flex items-center justify-center space-x-2 text-sm">
                            <i class="fas fa-plus"></i><span>Tambah Kartu</span>
                        </button>
                    </form>
                    <div id="kotoba-list" class="mt-5 space-y-2"></div>
                </div>

                <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                    <div class="flex items-center space-x-3 mb-5">
                        <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-green-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-question-circle text-white"></i>
                        </div>
                        <h3 class="text-lg sm:text-xl font-bold text-green-700">Soal Kuis</h3>
                    </div>
                    
                    <form id="quiz-form" class="space-y-4">
                        <div class="space-y-2">
                            <label class="flex items-center space-x-2 text-xs font-semibold text-gray-600">
                                <i class="fas fa-question text-slate-500 text-sm"></i><span>Pertanyaan</span>
                            </label>
                            <textarea id="quiz-question" required rows="2" placeholder="Tulis pertanyaan..."
                                      class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:border-sky-500 text-sm"></textarea>
                        </div>

                        <div class="space-y-2">
                            <label class="flex items-center space-x-2 text-xs font-semibold text-gray-600">
                                <i class="fas fa-image text-slate-500 text-sm"></i><span>Upload Gambar (Opsional)</span>
                            </label>
                            <input type="file" id="quiz-image" accept="image/*"
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-sky-500 text-sm">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" id="quiz-op-a" required placeholder="Pilihan A" class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm">
                            <input type="text" id="quiz-op-b" required placeholder="Pilihan B" class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm">
                            <input type="text" id="quiz-op-c" required placeholder="Pilihan C" class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm">
                            <input type="text" id="quiz-op-d" required placeholder="Pilihan D" class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm">
                        </div>

                        <div class="space-y-2">
                            <label class="flex items-center space-x-2 text-xs font-semibold text-gray-600">
                                <i class="fas fa-check-circle text-slate-500 text-sm"></i><span>Jawaban Benar</span>
                            </label>
                            <select id="quiz-correct" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm">
                                <option value="a">Jawaban A</option>
                                <option value="b">Jawaban B</option>
                                <option value="c">Jawaban C</option>
                                <option value="d">Jawaban D</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full sm:w-auto px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-sm flex items-center justify-center space-x-2 text-sm">
                            <i class="fas fa-plus"></i><span>Tambah Soal</span>
                        </button>
                    </form>
                    <div id="quiz-list" class="mt-5 space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let currentTopicSlug = null;
    let existingThumbnailUrl = "";

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    const Toast = Swal.mixin({
        toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
    });

    const fetchTopics = async () => {
        const res = await fetch('/api/admin/topics');
        const topics = await res.json();
        let tableHTML = `<table class="min-w-full divide-y divide-slate-200"><thead class="bg-slate-100"><tr><th class="px-6 py-4 text-left text-xs font-bold text-slate-600 uppercase tracking-wider">Judul</th><th class="px-6 py-4 text-left text-xs font-bold text-slate-600 uppercase tracking-wider hidden sm:table-cell">Kategori</th><th class="px-6 py-4 text-center text-xs font-bold text-slate-600 uppercase tracking-wider">Aksi</th></tr></thead><tbody class="bg-white divide-y divide-slate-100">`;
        topics.forEach(t => {
            tableHTML += `<tr data-id="${t.id}" data-title="${t.title}" data-slug="${t.category_slug}" data-desc="${t.description}" data-thumb="${t.thumbnail_url}" class="hover:bg-slate-50">
                <td class="px-6 py-4"><div class="flex items-center space-x-3"><img src="${t.thumbnail_url}" class="w-10 h-10 rounded object-cover border"><div class="text-sm font-semibold text-slate-800">${t.title}</div></div></td>
                <td class="px-6 py-4 hidden sm:table-cell"><span class="px-3 py-1 bg-slate-100 text-slate-700 rounded-full text-xs font-semibold">${t.category_slug}</span></td>
                <td class="px-6 py-4"><div class="flex flex-col sm:flex-row items-center justify-center gap-2"><button class="manage-content-btn bg-sky-600 text-white px-3 py-2 text-xs font-semibold rounded-md shadow-sm"><i class="fas fa-folder-open"></i></button><button class="edit-topic-btn bg-yellow-500 text-white px-3 py-2 text-xs font-semibold rounded-md shadow-sm"><i class="fas fa-edit"></i></button><button class="delete-topic-btn bg-red-600 text-white px-3 py-2 text-xs font-semibold rounded-md shadow-sm"><i class="fas fa-trash"></i></button></div></td></tr>`;
        });
        tableHTML += `</tbody></table>`;
        document.getElementById('topics-table-container').innerHTML = tableHTML;
    };

    document.getElementById('topic-form').addEventListener('submit', async e => {
        e.preventDefault();
        Swal.fire({ title: 'Sedang memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        const id = document.getElementById('topic-id').value;
        const fileInput = document.getElementById('topic-thumbnail');
        let thumbnail_url = existingThumbnailUrl;

        if (fileInput.files.length > 0) {
            thumbnail_url = await toBase64(fileInput.files[0]);
        }

        const payload = {
            title: document.getElementById('topic-title').value,
            category_slug: document.getElementById('topic-slug').value,
            description: document.getElementById('topic-description').value,
            thumbnail_url
        };

        const url = id ? `/api/admin/topics/${id}` : '/api/admin/topics';
        await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        
        Swal.close();
        Toast.fire({ icon: 'success', title: 'Data berhasil disimpan!' });
        resetTopicForm();
        fetchTopics();
    });

    const resetTopicForm = () => {
        document.getElementById('topic-form').reset();
        document.getElementById('topic-id').value = '';
        document.getElementById('topic-current-thumb').textContent = '';
        existingThumbnailUrl = "";
        document.getElementById('topic-submit-btn').innerHTML = '<i class="fas fa-plus-circle"></i><span>Tambah Topik</span>';
        document.getElementById('topic-cancel-btn').classList.add('hidden');
    };

    document.getElementById('topics-table-container').addEventListener('click', e => {
        const row = e.target.closest('tr');
        if (!row) return;
        const id = row.dataset.id;
        if (e.target.closest('.edit-topic-btn')) {
            document.getElementById('topic-id').value = id;
            document.getElementById('topic-title').value = row.dataset.title;
            document.getElementById('topic-slug').value = row.dataset.slug;
            document.getElementById('topic-description').value = row.dataset.desc;
            document.getElementById('topic-current-thumb').textContent = "Gambar saat ini: " + row.dataset.thumb;
            existingThumbnailUrl = row.dataset.thumb;
            document.getElementById('topic-submit-btn').innerHTML = '<i class="fas fa-save"></i><span>Update Topik</span>';
            document.getElementById('topic-cancel-btn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
        if (e.target.closest('.manage-content-btn')) {
            currentTopicSlug = row.dataset.slug;
            document.getElementById('modal-title').textContent = `Kelola Konten: ${row.dataset.title}`;
            document.getElementById('content-modal').classList.remove('hidden');
            loadContentForTopic(currentTopicSlug);
        }
        if (e.target.closest('.delete-topic-btn')) {
            Swal.fire({ title: 'Hapus Topik?', text: 'Data tidak bisa dikembalikan!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`/api/admin/topics/${id}`, { method: 'DELETE' }).then(() => { fetchTopics(); Toast.fire({ icon: 'success', title: 'Berhasil dihapus!' }); });
                }
            });
        }
    });

    const loadContentForTopic = async (slug) => {
        const [kotobaRes, quizRes] = await Promise.all([
            fetch(`/api/admin/kotoba/${slug}`),
            fetch(`/api/admin/quizzes/${slug}`)
        ]);
        const kotobaData = await kotobaRes.json();
        const quizData = await quizRes.json();

        const kotobaList = document.getElementById('kotoba-list');
        kotobaList.innerHTML = '';
        kotobaData.forEach((k, i) => {
            kotobaList.innerHTML += `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border">
                <div class="flex items-center space-x-3 truncate">
                    <img src="${k.image_url}" class="w-10 h-10 rounded border object-cover">
                    <img src="${k.word_url}" class="w-10 h-10 rounded border object-cover">
                    <span class="text-xs text-slate-500">Kartu #${i+1}</span>
                </div>
                <button data-id="${k.id}" class="delete-kotoba-btn text-red-600 p-2"><i class="fas fa-trash"></i></button>
            </div>`;
        });

        const quizList = document.getElementById('quiz-list');
        quizList.innerHTML = '';
        quizData.forEach((q, i) => {
            quizList.innerHTML += `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border">
                <div class="truncate">
                    <p class="text-sm font-bold text-slate-700 truncate">${q.question}</p>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">Jawaban: ${q.correct_answer.toUpperCase()}</span>
                </div>
                <button data-id="${q.id}" class="delete-quiz-btn text-red-600 p-2"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    };

    document.getElementById('kotoba-form').addEventListener('submit', async e => {
        e.preventDefault();
        Swal.fire({ title: 'Uploading...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const imgFile = document.getElementById('kotoba-image').files[0];
        const wordFile = document.getElementById('kotoba-word').files[0];
        
        const payload = {
            category_slug: currentTopicSlug,
            image_url: await toBase64(imgFile),
            word_url: await toBase64(wordFile)
        };

        await fetch('/api/admin/kotoba', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        Swal.close();
        document.getElementById('kotoba-form').reset();
        loadContentForTopic(currentTopicSlug);
    });

    document.getElementById('quiz-form').addEventListener('submit', async e => {
        e.preventDefault();
        Swal.fire({ title: 'Uploading...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const quizFile = document.getElementById('quiz-image').files[0];
        
        const payload = {
            category_slug: currentTopicSlug,
            question: document.getElementById('quiz-question').value,
            image_url: quizFile ? await toBase64(quizFile) : null,
            option_a: document.getElementById('quiz-op-a').value,
            option_b: document.getElementById('quiz-op-b').value,
            option_c: document.getElementById('quiz-op-c').value,
            option_d: document.getElementById('quiz-op-d').value,
            correct_answer: document.getElementById('quiz-correct').value
        };

        await fetch('/api/admin/quizzes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        Swal.close();
        document.getElementById('quiz-form').reset();
        loadContentForTopic(currentTopicSlug);
    });

    document.getElementById('content-modal').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const id = btn.dataset.id;
        const url = btn.classList.contains('delete-kotoba-btn') ? `/api/admin/kotoba/${id}` : btn.classList.contains('delete-quiz-btn') ? `/api/admin/quizzes/${id}` : null;
        if (url) {
            fetch(url, { method: 'DELETE' }).then(() => loadContentForTopic(currentTopicSlug));
        }
    });

    document.getElementById('close-modal-btn').onclick = () => document.getElementById('content-modal').classList.add('hidden');
    document.getElementById('topic-cancel-btn').onclick = resetTopicForm;

    fetchTopics();
});
</script>
</body>
</html>
