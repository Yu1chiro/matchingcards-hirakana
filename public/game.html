<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotoba Matching Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Efek saat kartu sudah berhasil dicocokkan */
        .card.cleared {
            filter: grayscale(100%);
            opacity: 0.4;
            transform: scale(0.95);
            pointer-events: none; /* Tidak bisa diklik lagi */
        }
        /* Animasi halus untuk banner instruksi */
        .pulse-subtle {
            animation: pulse-subtle 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
    </style>
</head>
<body class="font-poppins bg-slate-50 min-h-screen text-slate-800">
    
    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between max-w-4xl mx-auto">
                <button onclick='window.location.href = "/"' class="flex items-center gap-2 px-3 py-2 text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-all font-medium">
                    <i class="fas fa-arrow-left text-lg"></i>
                    <span class="hidden sm:inline">Kembali</span>
                </button>
                
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-sky-600 rounded-lg flex items-center justify-center shadow-sm">
                        <i class="fas fa-link text-white text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Matching Game</p>
                        <p class="text-sm text-slate-800 font-bold">Pasangkan Kata!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="relative pb-20">
        <div class="container mx-auto px-4 py-6 max-w-4xl">
            <div class="bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-6 lg:p-8">
                
                <div class="mb-6 bg-sky-50 border border-sky-100 rounded-xl p-3 sm:p-4 flex items-start sm:items-center gap-3 pulse-subtle">
                    <div class="w-8 h-8 rounded-full bg-sky-200 text-sky-700 flex items-center justify-center shrink-0">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                    <p class="text-xs sm:text-sm text-sky-800 font-medium leading-relaxed">
                        <strong class="font-bold">Cara Bermain:</strong> Ketuk 1 kartu pada kolom <strong>Gambar</strong> lalu pasangkan dengan 1 kartu di kolom <strong>Kosakata</strong>!
                    </p>
                </div>
                
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
                    <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-center">
                        <div class="flex flex-col items-center bg-sky-50 px-4 py-2 rounded-xl border border-sky-100">
                            <span class="text-[10px] sm:text-xs font-bold text-sky-600 uppercase">Pasangan</span>
                            <span class="text-lg sm:text-xl font-bold text-slate-800"><span id="matched-pairs">0</span>/<span id="total-pairs">0</span></span>
                        </div>
                        <div class="flex flex-col items-center bg-yellow-50 px-4 py-2 rounded-xl border border-yellow-100">
                            <span class="text-[10px] sm:text-xs font-bold text-yellow-600 uppercase">Skor</span>
                            <span id="score" class="text-lg sm:text-xl font-bold text-slate-800">0</span>
                        </div>
                    </div>
                    
                    <button onclick="initGame()" class="mx-auto sm:mx-0 flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-all font-semibold text-sm">
                        <i class="fas fa-sync-alt"></i> Ulangi
                    </button>
                </div>

                <div id="game-board" class="grid grid-cols-2 gap-3 sm:gap-6 relative">
                    <div class="flex flex-col gap-3">
                        <div class="text-center font-bold text-slate-400 text-xs sm:text-sm uppercase tracking-widest mb-1 pb-2 border-b-2 border-slate-100">
                            <i class="fas fa-image mr-1"></i> Gambar
                        </div>
                        <div id="col-images" class="flex flex-col gap-3"></div>
                    </div>
                    
                    <div class="hidden sm:block absolute left-1/2 top-10 bottom-0 w-px bg-slate-100 -translate-x-1/2"></div>

                    <div class="flex flex-col gap-3">
                        <div class="text-center font-bold text-slate-400 text-xs sm:text-sm uppercase tracking-widest mb-1 pb-2 border-b-2 border-slate-100">
                            <i class="fas fa-language mr-1"></i> Kosakata
                        </div>
                        <div id="col-words" class="flex flex-col gap-3"></div>
                    </div>
                </div>

            </div>
        </div>

        <div id="success-notification" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full transform scale-95 opacity-0">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5 relative">
                    <i class="fas fa-star text-5xl text-green-500 relative z-10"></i>
                    <div class="absolute inset-0 border-4 border-green-400 rounded-full animate-ping opacity-20"></div>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Hebat Sekali!</h2>
                <p class="text-slate-500 mb-6 text-sm">Kamu berhasil mencocokkan semua kata. <br>Skor akhir: <strong id="final-score" class="text-sky-600 text-lg">0</strong></p>
                <div class="space-y-3">
                    <button onclick="initGame()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-sky-200">
                        Main Lagi
                    </button>
                    <button onclick="window.history.back()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-all">
                        Kembali ke Menu
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    let gameData = [];
    let selectedImage = null;
    let selectedWord = null;
    let matchedPairs = 0;
    
    // REVISI: Menggunakan rawScore untuk kalkulasi desimal agar akurat
    let rawScore = 0; 
    let isAnimating = false;

    const colImages = document.getElementById('col-images');
    const colWords = document.getElementById('col-words');
    const totalPairsEl = document.getElementById('total-pairs');
    const matchedPairsEl = document.getElementById('matched-pairs');
    const scoreEl = document.getElementById('score');
    const successNotification = document.getElementById('success-notification');
    const finalScoreEl = document.getElementById('final-score');
    
    const levelId = window.location.pathname.split('/').pop();

    async function fetchAndStartGame() {
        try {
            const res = await fetch(`/api/kotoba/level/${levelId}`);
            if (!res.ok) throw new Error('Gagal mengambil data level');
            const apiData = await res.json();
            
            if (apiData.length === 0) throw new Error('Belum ada kartu di level ini.');
            
            gameData = apiData.map(item => ({ id: item.id, image: item.image_url, word: item.word_url }));
            initGame();
        } catch (error) {
            colImages.parentElement.parentElement.innerHTML = `
                <div class="col-span-2 text-center py-10">
                    <i class="fas fa-exclamation-triangle text-red-400 text-4xl mb-3"></i>
                    <p class="text-red-500 font-semibold text-sm">${error.message}</p>
                    <button onclick="window.history.back()" class="mt-4 px-5 py-2 bg-slate-800 text-white font-bold rounded-xl">Kembali</button>
                </div>`;
        }
    }

    function initGame() {
        colImages.innerHTML = '';
        colWords.innerHTML = '';
        successNotification.classList.add('hidden');
        gsap.set(successNotification.querySelector('div'), { scale: 0.95, opacity: 0 });

        selectedImage = null;
        selectedWord = null;
        matchedPairs = 0;
        rawScore = 0;
        isAnimating = false;
        updateUI();

        // Pisahkan pembuatan kartu Kiri (Gambar) dan Kanan (Teks)
        let images = [];
        let words = [];
        
        gameData.forEach(item => {
            images.push(createCard(item, 'image'));
            words.push(createCard(item, 'word'));
        });

        // Acak masing-masing kolom secara independen
        images.sort(() => 0.5 - Math.random());
        words.sort(() => 0.5 - Math.random());

        images.forEach(card => colImages.appendChild(card));
        words.forEach(card => colWords.appendChild(card));
    }

    function updateUI() {
        totalPairsEl.textContent = gameData.length;
        matchedPairsEl.textContent = matchedPairs;
        // REVISI: Tampilkan skor dibulatkan agar rapi (misal 33.3 jadi 33)
        scoreEl.textContent = Math.round(rawScore);
    }

    function createCard(item, type) {
        const card = document.createElement('div');
        card.className = 'card cursor-pointer bg-white border-2 border-slate-200 hover:border-sky-300 rounded-xl sm:rounded-2xl transition-all duration-200 overflow-hidden h-24 sm:h-32 flex items-center justify-center p-2 relative';
        card.dataset.id = item.id;
        card.dataset.type = type;
        
        const contentSrc = type === 'image' ? item.image : item.word;
            
        card.innerHTML = `<img src="${contentSrc}" class="w-full h-full object-contain pointer-events-none">`;
        card.addEventListener('click', () => handleCardClick(card));
        return card;
    }

    function playSlashAnimation(cards, isMatch, onCompleteCallback) {
        const elementsToAnimate = [];

        cards.forEach(card => {
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 z-10';
            overlay.style.backgroundColor = isMatch ? 'rgba(22, 163, 74, 0.2)' : 'rgba(220, 38, 38, 0.2)'; 
            
            const slash = document.createElement('div');
            slash.className = 'absolute top-1/2 left-1/2 w-[150%] h-2 rounded-full z-20';
            slash.style.backgroundColor = isMatch ? '#ffffff' : '#f87171';
            slash.style.boxShadow = `0 0 12px 3px ${isMatch ? 'rgba(34, 197, 94, 0.6)' : 'rgba(239, 68, 68, 0.6)'}`;

            card.appendChild(overlay);
            card.appendChild(slash);
            elementsToAnimate.push(overlay, slash);

            const randomAngle = -20 + Math.random() * 40; 
            gsap.set(slash, { transform: `translate(-50%, -50%) rotate(${randomAngle}deg)` });
        });

        const overlays = elementsToAnimate.filter((_, i) => i % 2 === 0);
        const slashes = elementsToAnimate.filter((_, i) => i % 2 !== 0);

        gsap.timeline({ 
            onComplete: () => {
                elementsToAnimate.forEach(el => el.remove());
                if (onCompleteCallback) onCompleteCallback();
            }
        })
        .fromTo(overlays, { opacity: 0 }, { duration: 0.1, opacity: 1 })
        .fromTo(slashes, { scaleX: 0, transformOrigin: 'left center' }, { duration: 0.2, scaleX: 1 }, "-=0.05")
        .to(slashes, { duration: 0.15, scaleX: 0, transformOrigin: 'right center' }, "+=0.1")
        .to(overlays, { duration: 0.2, opacity: 0 }, "-=0.15");
    }

    function handleCardClick(card) {
        if (isAnimating || card.classList.contains('cleared')) return;

        if (card.dataset.type === 'image') {
            if (selectedImage) removeSelectionStyle(selectedImage);
            selectedImage = card;
            addSelectionStyle(selectedImage);
        } else {
            if (selectedWord) removeSelectionStyle(selectedWord);
            selectedWord = card;
            addSelectionStyle(selectedWord);
        }

        if (selectedImage && selectedWord) {
            isAnimating = true;
            checkMatch(selectedImage, selectedWord);
        }
    }

    function addSelectionStyle(card) {
        card.classList.replace('border-slate-200', 'border-sky-500');
        card.classList.replace('hover:border-sky-300', 'border-sky-500');
        card.classList.add('bg-sky-50', 'ring-4', 'ring-sky-100', 'scale-[1.02]');
    }

    function removeSelectionStyle(card) {
        card.classList.replace('border-sky-500', 'border-slate-200');
        card.classList.replace('border-sky-500', 'hover:border-sky-300');
        card.classList.remove('bg-sky-50', 'ring-4', 'ring-sky-100', 'scale-[1.02]');
    }

    function checkMatch(imgCard, wordCard) {
        // REVISI: Logika Skor Dinamis (Max 100)
        const basePoint = 100 / gameData.length; 
        const penaltyPoint = basePoint * 0.25; // Pengurangan 25% jika salah

        if (imgCard.dataset.id === wordCard.dataset.id) {
            // MATCH!
            rawScore += basePoint;
            matchedPairs++;
            updateUI();

            [imgCard, wordCard].forEach(c => {
                c.classList.replace('border-sky-500', 'border-green-500');
                c.classList.replace('bg-sky-50', 'bg-green-50');
                c.classList.replace('ring-sky-100', 'ring-green-100');
            });

            playSlashAnimation([imgCard, wordCard], true, () => {
                imgCard.classList.add('cleared');
                wordCard.classList.add('cleared');
                
                imgCard.classList.remove('bg-green-50', 'ring-4', 'ring-green-100', 'scale-[1.02]');
                wordCard.classList.remove('bg-green-50', 'ring-4', 'ring-green-100', 'scale-[1.02]');
                
                resetSelection();
                if (matchedPairs === gameData.length) showSuccessNotification();
            });

        } else {
            // NO MATCH :(
            rawScore = Math.max(0, rawScore - penaltyPoint); // Skor tidak boleh minus
            updateUI();

            [imgCard, wordCard].forEach(c => {
                c.classList.replace('border-sky-500', 'border-red-500');
                c.classList.replace('bg-sky-50', 'bg-red-50');
                c.classList.replace('ring-sky-100', 'ring-red-100');
                
                gsap.to(c, { x: [-5, 5, -5, 5, 0], duration: 0.4 });
            });

            playSlashAnimation([imgCard, wordCard], false, () => {
                removeSelectionStyle(imgCard);
                removeSelectionStyle(wordCard);
                imgCard.classList.replace('border-red-500', 'border-slate-200');
                wordCard.classList.replace('border-red-500', 'border-slate-200');
                imgCard.classList.remove('bg-red-50', 'ring-red-100');
                wordCard.classList.remove('bg-red-50', 'ring-red-100');
                resetSelection();
            });
        }
    }

    function resetSelection() {
        selectedImage = null;
        selectedWord = null;
        isAnimating = false;
    }

    function showSuccessNotification() {
        // Tampilkan nilai bulat. Jika main sempurna, (100/3) * 3 akan genap 100 berkat Math.round
        finalScoreEl.textContent = Math.round(rawScore);
        successNotification.classList.remove('hidden');
        gsap.to(successNotification.querySelector('div'), {
            duration: 0.6, scale: 1, opacity: 1, ease: 'back.out(1.5)'
        });
    }

    document.addEventListener('DOMContentLoaded', fetchAndStartGame);
</script>
</body>
</html>
