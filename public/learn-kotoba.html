<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelajari Kosakata</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-28 relative">

    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex items-center gap-3">
            <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tahap 1</p>
                <h1 class="text-lg font-display font-bold text-slate-800">Pelajari Kosakata</h1>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6 flex gap-4 items-center">
            <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center text-white text-xl shrink-0 shadow-sm">
                <i class="fas fa-brain"></i>
            </div>
            <p class="text-sm text-slate-600 font-medium">
                Silahkan pelajari kosakata di bawah ini. Setelah selesai, tekan tombol <strong>"Sudah Ingat!"</strong> untuk menandai kosakata ini telah dihafal.
            </p>
        </div>

        <div id="flashcards-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 animate-pulse h-48"></div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 animate-pulse h-48"></div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <div class="container mx-auto max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-sm font-medium text-slate-500 hidden sm:block">
                Sudah hafal semua kosakata di atas?
            </p>
            <button onclick="openConfirmModal()" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 active:scale-95 text-white text-base font-bold py-3 px-8 rounded-xl shadow-lg shadow-green-200 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-check-circle text-xl"></i>
                Sudah Ingat!
            </button>
        </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div id="modal-panel" class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-3xl">
                    <i class="fas fa-question-circle"></i>
                </div>
                <h3 class="text-xl font-display font-bold text-slate-800 mb-2">Sudah yakin?</h3>
                <p class="text-slate-500 text-sm leading-relaxed">Apakah kamu yakin sudah ingat semuanya?</p>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition shadow-sm active:scale-95">
                    Belum
                </button>
                <button onclick="processRemembered()" id="btn-confirm" class="flex-1 py-3.5 bg-green-500 text-white font-bold rounded-xl hover:bg-green-600 shadow-md shadow-green-200 transition active:scale-95 flex items-center justify-center gap-2">
                    Yakin
                </button>
            </div>
        </div>
    </div>

<script>
    const levelId = window.location.pathname.split('/').pop();
    const params = new URLSearchParams(window.location.search);
    const topicId = params.get('topic_id');

    function goBack() {
        if(topicId) window.location.href = `/levels?topic_id=${topicId}`;
        else window.history.back();
    }

    async function fetchKotoba() {
        const container = document.getElementById('flashcards-container');
        try {
            const res = await fetch(`/api/kotoba/level/${levelId}`);
            if (!res.ok) throw new Error('Gagal mengambil data');
            const data = await res.json();
            
            if (data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">Belum ada kosakata di part ini.</div>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-200 p-3 transition-shadow flex flex-col gap-3">
                    <div class="w-full h-32 bg-slate-50 rounded-xl flex items-center justify-center p-2 border border-slate-100">
                        <img src="${item.image_url}" class="max-h-full max-w-full object-contain drop-shadow-sm" alt="Gambar Ilustrasi">
                    </div>
                    <div class="w-full h-16 bg-blue-50/50 rounded-xl flex items-center justify-center p-2 border border-blue-100/50">
                        <img src="${item.word_url}" class="max-h-full max-w-full object-contain" alt="Gambar Teks">
                    </div>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">${error.message}</div>`;
        }
    }

    // --- LOGIKA MODAL POPUP ---
    const modal = document.getElementById('confirm-modal');
    const modalPanel = document.getElementById('modal-panel');

    function openConfirmModal() {
        modal.classList.remove('hidden');
        // Transisi Halus (Fade In & Scale Up)
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalPanel.classList.remove('scale-95');
            modalPanel.classList.add('scale-100');
        }, 10);
    }

    function closeConfirmModal() {
        modal.classList.add('opacity-0');
        modalPanel.classList.remove('scale-100');
        modalPanel.classList.add('scale-95');
        // Sembunyikan div setelah transisi selesai
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function processRemembered() {
        // Simpan key di localStorage
        localStorage.setItem(`learned_level_${levelId}`, 'true');
        
        // Ubah state tombol Yakin menjadi loading
        const btnConfirm = document.getElementById('btn-confirm');
        btnConfirm.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i> Proses...';
        btnConfirm.disabled = true;
        
        // Arahkan kembali ke halaman Level setelah jeda sejenak
        setTimeout(() => {
            if(topicId) {
                window.location.href = `/levels?topic_id=${topicId}`;
            } else {
                window.history.back();
            }
        }, 600);
    }

    document.addEventListener('DOMContentLoaded', fetchKotoba);
</script>
</body>
</html>
